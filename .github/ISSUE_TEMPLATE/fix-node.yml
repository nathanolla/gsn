name: Report a correction
description: A listed shop closed, moved, changed numbers — or shouldn't be listed at all.
title: "[fix] "
labels: [correction]
body:
  - type: input
    id: node
    attributes: { label: Which entry?, placeholder: "name or link from the site" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
      description: Closed / moved / wrong info / shouldn't be listed. A source link helps the verification pass go faster.
    validations: { required: true }
