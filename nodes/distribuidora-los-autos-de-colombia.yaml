REGION REPORT: Puerto Rico (beyond Power Sports)
No Moto Guzzi club, independent Guzzi specialist, or parts house found beyond ERH Eurosports. Sources checked 2026-08-22: DDG
  searches ("Moto Guzzi República Dominicana", "concesionario Moto Guzzi Santo Domingo
  taller", "@motoguzzird/Moto Guzzi Dominicana website"). Moto Market (motomarket.com.do)
  is a multi-brand marketplace with no Guzzi dealer listing reachable; Teruel & Co
  (teruel.us) carries X1000/Zontes/Kove/Aprilia but no Moto Guzzi; Motomarcas Srl
  shows no Guzzi among brands; only used-bike market activity (FB Marketplace V85TT
  2023, Santo Domingo).
Sources checked 2026-08-22: DDG ("Moto Guzzi Puerto Rico dealer"), powersportspr.com
  pages, Cycle Trader PR dealer listing (blocked/no data returned), PR directories.
  Only Power Sports PR surfaced as a Guzzi-carrying dealer; no Moto Guzzi club or
  independent Guzzi specialist found. The official motoguzzi.com US dealer-locator
  was not fetched (403-blocks fetchers per lane instructions).
