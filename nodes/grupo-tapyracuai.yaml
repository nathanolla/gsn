- date: 2026-08-22
  method: website
  fact: 'IMPORTANT CAVEAT: the same site states the company "es una persona jurídica
    incautada en el marco de una causa penal y administrada por la Secretaría Nacional
    de Administración de Bienes Incautados y Comisados - SENABICO" per Oficio Fiscal
    Nº 137/2022 and Resolución Senabico Nº 175/2022 — i.e. seized in a criminal proceeding
    and under state administration since 2022, while continuing as exclusive Piaggio-group
    representative. Phone (021) 286 167 and Avenida Sacramento, Asunción per todosnegocios.com
    and autoyas.com (2025); coordinates geocoded from Avenida Sacramento, Asunción.'
