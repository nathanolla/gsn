  fact: 'Auto Magazine Ecuador article "Piaggio, Guzzi, Aprilia y Vespa con Maresa
    en Ecuador" (automagazine.ec, site copyright 2004-2026 with 2026-dated content):
    Corporación Maresa (4 decades in Ecuador, ex-rep of Mazda/Fiat/Kawasaki etc.)
    takes on Piaggio Group representation and "representará también a estas otras
    icónicas tres marcas: Vespa, Aprilia y Moto Guzzi", with new exhibition locals
    planned in Quito and Guayaquil; Moto Guzzi placed in the superior price segment.'
