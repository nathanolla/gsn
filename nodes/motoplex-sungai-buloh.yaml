  fact: 'BigWheels.my (Feb 2024) confirms MotoPlex Sungai Buloh grand opening as the
    fourth MotoPlex in Malaysia. Managed by Welly Sungai Buloh Sdn Bhd, official dealer
    appointed by Didi Group (official distributor of Piaggio, Vespa, Aprilia and Moto
    Guzzi in Malaysia). 3,400 sqft total (2,200 sqft showroom + 1,200 sqft service
    centre). Director: Mr. Ngo Yoke Kwang. Welly World Cycle website (wellyworldcycle.com)
    confirms Moto Guzzi among carried brands alongside Ducati, Yamaha, Vespa, Aprilia,
    Husqvarna. Coordinates approximate, derived from Sungai Buloh, Selangor area.
    Exact street address not publicly listed.'
