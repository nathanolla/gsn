  fact: Moto Guzzi Mjøsa website (https://guzzimjosa.com/) states it is a local chapter of
    Norsk Moto Guzzi Klubb, formed in 2022, holding monthly coffee meetings at Cobee Restaurant,
    Storgata 105, Moelv.
- date: 2026-09-10
  method: website
  fact: Founding page (https://guzzimjosa.com/om-oss/2022-oppstarten/) says the chapter grew
    from a Facebook thread and held its first meeting on 5 December 2022 in Moelv with 18
    attendees.
- date: 2026-09-10
  method: community-endorsement
