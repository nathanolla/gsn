<svg xmlns="http://www.w3.org/2000/svg" width="104.0mm" height="79.0mm"
     viewBox="0 0 104.0 79.0">
  <title>Guzzi Support Network — counter sticker</title>
  <!-- bleed background -->
  <rect x="0" y="0" width="104.0" height="79.0" fill="#efefea"/>
  <!-- trim line (100x75mm): printers cut here; keep for proof, harmless if printed -->
  <rect x="2.0" y="2.0" width="100.0" height="75.0"
        fill="none" stroke="#bbb" stroke-width="0.1" stroke-dasharray="1 1.5"/>
  <!-- the double red rule, top and bottom -->
  <g stroke="#c8102e" stroke-width="0.8">
    <line x1="6.0" y1="8.0" x2="98.0" y2="8.0"/>
    <line x1="6.0" y1="9.6" x2="98.0" y2="9.6"/>
    <line x1="6.0" y1="69.4" x2="98.0" y2="69.4"/>
    <line x1="6.0" y1="71.0" x2="98.0" y2="71.0"/>
  </g>
  <g font-family="'Times New Roman',Times,serif" fill="#111">
    <text x="9.0" y="17.0" font-size="6.0" font-weight="bold">The
      <tspan fill="#c8102e">GUZZI</tspan> Support Network</text>
    <text x="9.0" y="24.5" font-size="4.2" font-style="italic">&#8220;Where&#8230;?&#8221; &#8212; answered.</text>
    <text x="9.0" y="31.0" font-size="3.2">Every shop, wrench, parts depot</text>
    <text x="9.0" y="35.4" font-size="3.2">and club that keeps a Moto Guzzi</text>
    <text x="9.0" y="39.8" font-size="3.2">running &#8212; one community-kept,</text>
    <text x="9.0" y="44.2" font-size="3.2">freshness-dated map.</text>
    <text x="9.0" y="51.0" font-size="3.5" font-weight="bold">Scan it. Save the nodes. Ride.</text>
    <text x="9.0" y="58.0" font-size="3.8" font-family="'Courier New',monospace">guzzisupport.network</text>
    <text x="9.0" y="65.4" font-size="2.4" fill="#555">free to listed shops &#183; no ads, no tracking, no accounts &#183; ODbL data</text>
    <text x="9.0" y="68.6" font-size="2.4" fill="#555">not affiliated with, endorsed or sponsored by Piaggio Group or Moto Guzzi</text>
  </g>
